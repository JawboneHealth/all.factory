services:
  db:
    image: postgres:16
    container_name: allfactory-postgres
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: allfactory
    volumes:
      - allfactory_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d allfactory"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: allfactory-backend
    ports:
      - "8003:8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:password@db:5432/allfactory
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE=http://10.1.11.250:8003
    container_name: allfactory-frontend
    ports:
      - "3002:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  allfactory_pgdata: